<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontend/CSS/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=DM+Serif+Display:ital@0;1&family=Onest:wght@100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>PS Order Hub</title>

    <script>
        const token = localStorage.getItem('token');

if (!token) {

    window.location.href = '/login';
}
    </script>
</head>
<body>
    

    

    <div id="top-bar">
    

        <div id="top-bar-functions">
            <a href="/dashboard">Home</a>
            <a href="/orders">Orders</a>
            <a href="/profile">Profile</a>
        </div>

        <div id="user">
            
            <img src="frontend/img/logos/user (2).png">
            <p id="username"></p>

        </div>


    </div>
    
    <div id="title-text">
        <img src="frontend/img/logos/dashboard.png">
    <h1 id="text-dashboard">Dashboard</h1>
    </div>

    <div id="container">

        <div id="infirmary-status" style="grid-area: box-1">

            <p id="title">🟢 Status</p>
            
            <footer class="infirmary-status-element">
                <p style="color:black">Total Orders:</p>
                <p id="total_pending"></p>
            </footer>
        </div>

        <div id="nurse-available" style="grid-area: box-2">
            <ul id="nurses">
            <p id="title">Pending Orders</p>
                <li>
                    <img src="frontend/img/logos/user (1).png">
                    <p>Nurse name here</p>
                </li>
                <li>
                    <img src="frontend/img/logos/user (1).png">
                    <p>Nurse name here</p>
                </li>
            </ul>
        </div>

        <div id="patient-info" style="grid-area: box-3">
            <p id="title">📄 Profile Information</p>

            <footer id="patient-info-elements">
                <p id="user_name"></p>
                <p id="email"></p>
                <p id="contact"></p>
            </footer>
        </div>

        <div id="bmi" style="grid-area: box-4">
            <img src="frontend/img/logos/fluffy whip.jpg">
            <footer id="image-item">
            <h2 id="school-title">Fluffy Whip</h2>
            </footer>
        </div>


    </div>

     

    

    <script>

        const orders_clicked = document.getElementById("infirmary-status");

        orders_clicked.addEventListener('click', () => {
            window.location.href = '/orders';
        });

        loadProfileInfo();
        function loadProfileInfo() {
            fetch('/getProfileInfo', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => response.json())
            .then(data => {
                
                document.getElementById('user_name').textContent = data.username;
                document.getElementById('email').textContent = data.email;
                document.getElementById('contact').textContent = data.contact;

                const topBarUsername = document.getElementById('username');
        if (topBarUsername) {
            topBarUsername.textContent = data.username || 'User';
        }
            })

            
            .catch(error => console.error('Error fetching profile info:', error));
        }

        loadPendingOrders()
        function loadPendingOrders() {
            fetch('/getOrderCount')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('total_pending').textContent = data.totalOrders;
                    console.log(data.shippingOrders);
                })
                .catch(error => console.error('Error fetching order counts:', error));
        }

        //CVSU Link
        const clickBox = document.getElementById('bmi');

        clickBox.addEventListener('click', () => {
            window.open('https://www.cvsu-naic.edu.ph/', '_blank');
        });

        //For the menu bar visibility when pressed
        function toggleVisibility() {
            const element = document.getElementById("menu");
            const show = document.getElementById("show-menu");

            if (element.style.transform === "translateX(0px)") {
                element.style.transform = "translateX(-250px)";
                show.style.transform = "translateX(0px)";
                setTimeout(() => {
        element.style.display = "none";
    }, 500);
            } else {
                element.style.display = "flex";
                requestAnimationFrame(() => {
        element.style.transform = "translateX(0px)";
        show.style.transform = "translateX(250px)";
        element.style.transition = "all 0.5s ease-in-out";
    });
            }
        }

        window.addEventListener('scroll', function() {
    const topBar = document.getElementById('top-bar');
    
    if (window.scrollY > 10) {
        topBar.classList.add('shrunk');
    } else {
        topBar.classList.remove('shrunk');
    }
});

    </script>
</body>
</html>
