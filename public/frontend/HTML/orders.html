<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="frontend/CSS/orders.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=DM+Serif+Display:ital@0;1&family=Onest:wght@100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>cvsuAPP</title>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
        }
    </script>
</head>
<body>

    <div id="top-bar">
        <div id="top-bar-functions">
            <a href="/dashboard">Home</a>
            <a href="/orders">Orders</a>
            <a href="/profile">Profile</a>
        </div>
        <div id="user">
            <img src="frontend/img/logos/user (2).png">
            <p id="username">Username</p>
        </div>
    </div>

    <div id="page-header">
        <div id="page-title">
            <h1>Orders</h1>
            <p>Manage and monitor customer purchases.</p>
        </div>

        <div id="order-summary">
            <div class="summary-card">
                <h2 id="total_orders"></h2>
                <span>Total Orders</span>
            </div>
            <div class="summary-card">
                <h2 id="shipping_orders"></h2>
                <span>Shipping</span>
            </div>
            <div class="summary-card">
                <h2 id="received_orders"></h2>
                <span>Received</span>
            </div>
            <div class="summary-card">
                <h2 id="returned_orders"></h2>
                <span>Returned</span>
            </div>
        </div>
    </div>

    <!-- SEARCH -->
    <div id="table-top">
        <input type="text" id="search" placeholder="🔍 Search buyer or product...">
    </div>

    <!-- FILTERS -->
    <div id="navbar">
        <a data-action="showAll" class="active">All</a>
        <a data-action="shipping">Shipping</a>
        <a data-action="received">Delivered</a>
        <a data-action="returned">Returned</a>
    </div>

    <!-- TABLE -->
    <div id="order_list">
        <table id="lists">
            <thead>
                <tr>
                    <th class="col-img"></th> 
                    <th>Buyer Name</th>
                    <th>Order ID</th>
                    <th>Product Name</th>
                    <th>Product Status</th>
                    <th>Price</th>
                    <th>Piece</th>
                    <th>Payment Method</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
    </div>

    <script>
        loadProfileInfo();
        let allCurrentOrders = [];


        function loadProfileInfo() {
            fetch('/getProfileInfo', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => response.json())
            .then(data => {
                const topBarUsername = document.getElementById('username');
        if (topBarUsername) {
            topBarUsername.textContent = data.username || 'User';
        }
            })

            
            .catch(error => console.error('Error fetching profile info:', error));
        }

        loadNumberOfOrders();
        loadAll();
        
        function loadNumberOfOrders() {
            fetch('/getOrderCount')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('total_orders').textContent = data.totalOrders;
                    document.getElementById('shipping_orders').textContent = data.shippingOrders;
                    document.getElementById('received_orders').textContent = data.receivedOrders;
                    document.getElementById('returned_orders').textContent = data.returnedOrders;
                })
                .catch(error => console.error('Error fetching order counts:', error));
        }

        window.addEventListener('scroll', function() {
            const topBar = document.getElementById('top-bar');
            if (window.scrollY > 10) {
                topBar.classList.add('shrunk');
            } else {
                topBar.classList.remove('shrunk');
            }
        });

        function generateActionButtons(currentStatus, currentView) {
            let buttonsHtml = '';
            const statusLower = currentStatus.toLowerCase();
            
            if (currentView !== 'shipping' && statusLower !== 'shipping') {
                buttonsHtml += `<button class="action-btn" data-status="Shipping">Shipping</button> `;
            }
            if (currentView !== 'received' && statusLower !== 'received' && statusLower !== 'delivered') {
                buttonsHtml += `<button class="action-btn" data-status="Received">Delivered</button> `;
            }
            if (currentView !== 'returned' && statusLower !== 'returned') {
                buttonsHtml += `<button class="action-btn" data-status="Returned">Returned</button>`;
            }
            return buttonsHtml;
        }

        async function attachRowActions(orderRow, order) {
            const buttons = orderRow.querySelectorAll('.action-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const newStatus = btn.getAttribute('data-status');
                    const orderId = order.order_id;
                    
                    let endpoint = '';
                    if (newStatus === 'Received') endpoint = `/updateOrderToReceived/${orderId}`;
                    else if (newStatus === 'Shipping') endpoint = `/updateOrderToShipping/${orderId}`;
                    else if (newStatus === 'Returned') endpoint = `/updateOrderToReturned/${orderId}`;

                    try {
                        const response = await fetch(endpoint, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ status: newStatus })
                        });

                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                        loadNumberOfOrders();
                        const activeTab = document.querySelector('#navbar a.active').dataset.action;
                        if (activeTab === 'shipping') loadShipping();
                        else if (activeTab === 'received') loadReceived();
                        else if (activeTab === 'returned') loadReturned();
                        else loadAll();

                    } catch (error) {
                        console.error('Error updating order status:', error);
                    }
                });
            });

        }

        function displayOrders(orders, viewName) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;">No orders found.</td></tr>';
                return;
            }

            orders.forEach(order => {
                const orderRow = document.createElement('tr');
                orderRow.className = 'order order_rows';
                orderRow.innerHTML = `
                    <td><img src="frontend/img/logos/No_Image_Available.jpg" style="width: 50px;"></td>
                    <td>${order.username || ''}</td>
                    <td>${order.order_id || 'N/A'}</td>
                    <td>${order.order_name || ''}</td>
                    <td>${order.order_status || ''}</td>
                    <td>₱${order.order_price || 0}</td>
                    <td>${order.order_piece || 0}</td>
                    <td>${order.order_paymentMethod || ''}</td>
                    <td>${generateActionButtons(order.order_status || '', viewName)}</td>
                `;
                tbody.appendChild(orderRow);
                attachRowActions(orderRow, order);
            });
        }

        async function renderOrders(endpoint, viewName) {
            try {
                const response = await fetch(endpoint);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                allCurrentOrders = await response.json();
                
                const searchTerm = document.getElementById('search').value.toLowerCase().trim();
                if (searchTerm) {
                    filterAndDisplayOrders(searchTerm, viewName);
                } else {
                    displayOrders(allCurrentOrders, viewName);
                }
            } catch (error) {
                console.error('Error loading orders:', error);
                document.getElementById('table-body').innerHTML = '<tr><td colspan="9" style="text-align:center;">Failed to load orders.</td></tr>';
            }
        }

        function filterAndDisplayOrders(searchTerm, viewName) {
            const filtered = allCurrentOrders.filter(order => {
                const buyer = (order.username || '').toLowerCase();
                const product = (order.order_name || '').toLowerCase();
                return buyer.includes(searchTerm) || product.includes(searchTerm);
            });
            displayOrders(filtered, viewName);
        }

        function loadShipping() { renderOrders('/getAllShipping', 'shipping'); }
        function loadAll() { renderOrders('/getAllOrders', 'showAll'); }
        function loadReceived() { renderOrders('/getAllReceived', 'received'); }
        function loadReturned() { renderOrders('/getAllReturned', 'returned'); }

        document.getElementById('search').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase().trim();
            const activeTab = document.querySelector('#navbar a.active').dataset.action;
            filterAndDisplayOrders(searchTerm, activeTab);
        });

        document.getElementById('navbar').addEventListener('click', function(event) {
            const target = event.target;
            if (target.tagName === 'A' && target.dataset.action) {
                document.querySelectorAll('#navbar a').forEach(link => link.classList.remove('active'));
                target.classList.add('active');        
                
                document.getElementById('search').value = '';

                const action = target.dataset.action;
                if (action === 'showAll') loadAll();
                else if (action === 'shipping') loadShipping();
                else if (action === 'received') loadReceived();
                else if (action === 'returned') loadReturned();
            }
        });
    </script>
</body>
</html>
