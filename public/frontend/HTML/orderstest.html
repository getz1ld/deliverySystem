    <script>


        //For the menu bar visibility when pressed
        function toggleVisibility() {
            const element = document.getElementById("menu");
            const show = document.getElementById("show-menu");

            if (element.style.transform === "translateX(0px)") {
                element.style.transform = "translateX(-250px)";
                show.style.transform = "translateX(0px)";
                setTimeout(() => {
        element.style.display = "none";
    }, 500);
            } else {
                element.style.display = "flex";
                requestAnimationFrame(() => {
        element.style.transform = "translateX(0px)";
        show.style.transform = "translateX(250px)";
        element.style.transition = "all 0.5s ease-in-out";
    });
            }
        }

        window.addEventListener('scroll', function() {
    const topBar = document.getElementById('top-bar');
    
    if (window.scrollY > 10) {
        topBar.classList.add('shrunk');
    } else {
        topBar.classList.remove('shrunk');
    }
});

/*THIS LOADS ALL THE ORDERS (ALL SECTION)*/
async function loadShipping() {
        const container = document.getElementById('lists');
        console.log("Attempting to fetch orders..."); // Debug log

        try {
            const response = await fetch('/getAllShipping'); 
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const orders = await response.json();
            console.log("Orders received:", orders); // Check if data is actually here

            container.innerHTML = ''; // Clear the list

            if (orders.length === 0) {
                container.innerHTML = '<li>No orders found in database.</li>';
                return;
            }

            orders.forEach(order => {
                const orderItem = document.createElement('li');
                orderItem.className = 'order';

                orderItem.innerHTML = `
                    <div id="order_info">
                    <img src="frontend/img/logos/No_Image_Available.jpg">
                    <p>${order.order_name}</p>
                    <p>${order.order_status}</p>
                    <p>${order.order_paymentMethod}</p>
                    </div>
                `;
                    orderItem.addEventListener('click', () => {
            console.log(`Book clicked: ${order.order_name} (ID: ${order.order_id})`);
});
                container.appendChild(orderItem);
            });
        } catch (error) {
            console.error('Error loading books:', error);
            container.innerHTML = '<li>Failed to load books.</li>';
        }
    }

    /*THIS IS WHERE THE NAVBAR ACTION IS HAPPENING*/
document.getElementById('navbar').addEventListener('click', function(event) {
    const target = event.target;
    
    if (target.tagName === 'A' && target.dataset.action) {
        const allLinks = document.querySelectorAll('#navbar a');
        allLinks.forEach(link => link.classList.remove('active'));

        // 2. Add 'active' class to the clicked link
        target.classList.add('active');        
        const action = target.dataset.action;

        switch(action) {
            case 'showAll':
                console.log("Running logic to show all orders...");
                loadAll();
                const showall_button = document.getElementById('showall');
                showall_button.classList.add('hidden-state');
                break;
            case 'ship':
                console.log("Running shipping logic...");
                break;
            case 'shipping':
                console.log("Generating CSV export...");
                loadShipping();
                break;
            case 'received':
                loadReceived();
                break;
            case 'returned':
                loadReturned();
                break;
            default:
                console.log("Unknown action");
        }
    }
});
